# Quantum Trader — local / self-hosted stack.
# Postgres + Redis are included for the persistence & pub/sub roadmap
# (trade journal, learning engine, horizontal scaling). The app runs without
# them today (in-memory), but they are wired for the next phase.
name: quantum-trader

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      QT_CORS_ORIGINS: http://localhost:3000
      # Inside the Compose network the DB is reached by service name, never
      # localhost. Overrides any QT_DB_URL in .env (which is for host runs).
      QT_DB_URL: postgresql://quantum:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/quantum
      QT_DATA_DIR: /app/data
    volumes:
      # SQLite history/journals/risk-guard state that is not in PostgreSQL.
      - backend-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Boot logs into Angel One, loads the scrip master and the instrument
      # universe before uvicorn serves /health; ~80-120s with a live login.
      start_period: 240s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_WS_BASE: ws://localhost:8000
      NEXT_PUBLIC_TV_SYMBOL: MCX:CRUDEOIL
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_DB: quantum
      POSTGRES_USER: quantum
      # Provide POSTGRES_PASSWORD via .env — never hard-code.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum -d quantum"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Copies the PostgreSQL journal to ./backups on the host (your Windows disk)
  # every QT_BACKUP_EVERY_MIN minutes; keeps the newest QT_BACKUP_KEEP dumps.
  db-backup:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      EVERY_MIN: ${QT_BACKUP_EVERY_MIN:-5}
      KEEP: ${QT_BACKUP_KEEP:-288}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/quantum_$$(date +%Y%m%d_%H%M%S).dump
          if pg_dump -h postgres -U quantum -d quantum -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; cp "$$f" /backups/quantum_latest.dump; else rm -f "$$f.tmp"; fi
          ls -1t /backups/quantum_2*.dump 2>/dev/null | tail -n +$$((KEEP + 1)) | xargs -r rm -f
          sleep $$((EVERY_MIN * 60))
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  backend-data:
