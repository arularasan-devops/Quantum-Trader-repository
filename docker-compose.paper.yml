# Quantum Trader — separate PAPER app, run beside the live stack without touching it.
#   docker compose -f docker-compose.paper.yml up -d --build
# Own project name => own containers, network and volumes (own Postgres, Redis,
# SQLite data). Backend on :8001, UI on :3001. Reads .env.paper (never .env).
# QT_TRADE_MODE is forced to paper here, so this app can never send a live order.
# Angel: give .env.paper its OWN SmartAPI key (a second SmartAPI app) so its
# login and rate limit don't compete with the live app's key.
name: quantum-trader-paper

services:
  backend:
    build: ./backend
    env_file: .env.paper
    environment:
      QT_TRADE_MODE: paper
      QT_AUTO_TRADE_ALLOW_LIVE: "false"
      QT_CORS_ORIGINS: http://localhost:3001
      QT_DB_URL: postgresql://quantum:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/quantum
      QT_DATA_DIR: /app/data
    volumes:
      - backend-data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 240s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8001
        NEXT_PUBLIC_WS_BASE: ws://localhost:8001
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8001
      NEXT_PUBLIC_WS_BASE: ws://localhost:8001
      NEXT_PUBLIC_TV_SYMBOL: MCX:CRUDEOIL
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_DB: quantum
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum -d quantum"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  backend-data:
